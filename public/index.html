<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TETRON 4 U — AI Chat</title>

<style>
:root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel2: #191d28;
    --border: #292e3b;
    --text: #f4f6fc;
    --muted: #929bad;
    --accent: #8b5cf6;
    --accent2: #06b6d4;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
}

button, textarea, select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    height: 100dvh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    background: #0e1017;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    transition: transform .25s ease;
    flex-shrink: 0;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 24px;
}

.brand img {
    width: 43px;
    height: 43px;
    object-fit: contain;
    border-radius: 12px;
}

.brand h2 {
    font-size: 17px;
    letter-spacing: 1px;
}

.brand small {
    color: var(--muted);
    font-size: 11px;
}

.new-chat {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: white;
    padding: 12px;
    border-radius: 12px;
    text-align: left;
    margin-bottom: 23px;
}

.section-title {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    margin: 0 0 12px 7px;
}

.history {
    flex: 1;
    overflow-y: auto;
}

.history-item {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 11px 9px;
    border-radius: 9px;
    margin-bottom: 5px;
    color: #cbd1df;
    font-size: 13px;
    cursor: pointer;
}

.history-item:hover {
    background: var(--panel2);
}

.history-item span {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    flex: 1;
}

.delete-history {
    background: transparent;
    color: var(--muted);
    border: 0;
}

.sidebar-bottom {
    border-top: 1px solid var(--border);
    padding-top: 15px;
    color: var(--muted);
    font-size: 12px;
}

/* MAIN */

.main {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 70px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    gap: 12px;
}

.top-left {
    display: flex;
    align-items: center;
    gap: 13px;
}

.menu-btn {
    background: transparent;
    border: 0;
    color: white;
    font-size: 24px;
}

.model-select {
    max-width: 200px;
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
    padding: 9px 11px;
    border-radius: 10px;
    outline: none;
}

.status {
    color: #6ee7b7;
    font-size: 12px;
}

/* CHAT AREA */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px 18px;
    scroll-behavior: smooth;
}

.welcome {
    max-width: 680px;
    margin: 10vh auto 0;
    text-align: center;
}

.welcome-logo {
    width: 78px;
    height: 78px;
    object-fit: contain;
    margin-bottom: 22px;
}

.welcome h1 {
    font-size: clamp(27px, 5vw, 42px);
    margin-bottom: 12px;
    letter-spacing: -1px;
}

.gradient-text {
    background: linear-gradient(90deg, #a78bfa, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.welcome p {
    color: var(--muted);
    line-height: 1.7;
    font-size: 14px;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 30px;
}

.suggestion {
    padding: 15px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: #dce2ef;
    border-radius: 13px;
    text-align: left;
    font-size: 13px;
}

.suggestion:hover {
    border-color: var(--accent);
}

.messages {
    max-width: 820px;
    margin: auto;
}

.message {
    display: flex;
    gap: 12px;
    margin: 0 auto 25px;
    line-height: 1.75;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.avatar {
    width: 34px;
    height: 34px;
    border-radius: 11px;
    background: var(--panel2);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    font-size: 17px;
}

.message-body {
    flex: 1;
    min-width: 0;
    padding-top: 4px;
    white-space: pre-wrap;
}

.message-name {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
}

.message-image {
    display: block;
    max-width: min(100%, 280px);
    max-height: 280px;
    border-radius: 12px;
    margin-bottom: 10px;
}

.copy-btn {
    background: var(--panel2);
    color: #cbd5e1;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 9px;
    margin-top: 8px;
    font-size: 11px;
}

/* COMPOSER */

.composer-wrap {
    padding: 12px 18px 18px;
}

.composer {
    max-width: 820px;
    margin: auto;
    border: 1px solid #353b4b;
    background: var(--panel);
    border-radius: 18px;
    padding: 12px;
}

.preview-area:empty {
    display: none;
}

.preview-area {
    padding: 3px 5px 12px;
}

.preview-area img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 10px;
}

.preview-remove {
    display: block;
    background: transparent;
    border: 0;
    color: #f87171;
    font-size: 12px;
    margin-top: 4px;
}

textarea {
    width: 100%;
    resize: none;
    max-height: 150px;
    min-height: 45px;
    background: transparent;
    border: 0;
    color: white;
    outline: none;
    padding: 10px 7px;
    font-size: 14px;
}

textarea::placeholder {
    color: #7e8799;
}

.composer-tools {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 8px;
}

.tool-left, .tool-right {
    display: flex;
    gap: 8px;
    align-items: center;
}

.tool-btn {
    background: var(--panel2);
    color: #cbd5e1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 13px;
}

.tool-btn.active {
    background: #44202b;
    color: #fb7185;
}

.send-btn {
    background: linear-gradient(135deg, var(--accent), #6d5dfc);
    border: 0;
    color: white;
    border-radius: 10px;
    padding: 10px 15px;
    font-weight: 600;
}

.send-btn:disabled {
    opacity: .5;
}

.disclaimer {
    max-width: 820px;
    margin: 10px auto 0;
    text-align: center;
    color: #717b8d;
    font-size: 10px;
    line-height: 1.5;
}

.backdrop {
    display: none;
}

/* MOBILE */

@media (max-width: 700px) {
    .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 280px;
        transform: translateX(-105%);
        box-shadow: none;
    }

    .sidebar.open {
        transform: translateX(0);
        box-shadow: 15px 0 50px #0008;
    }

    .backdrop.show {
        display: block;
        position: fixed;
        inset: 0;
        background: #0009;
        z-index: 9;
    }

    .topbar {
        height: 62px;
        padding: 0 12px;
    }

    .model-select {
        max-width: 165px;
        font-size: 12px;
        padding: 8px;
    }

    .status {
        display: none;
    }

    .chat {
        padding: 18px 13px;
    }

    .welcome {
        margin-top: 7vh;
    }

    .welcome-logo {
        width: 66px;
        height: 66px;
    }

    .suggestions {
        grid-template-columns: 1fr;
        gap: 9px;
    }

    .composer-wrap {
        padding: 8px 10px 12px;
    }

    .tool-btn {
        padding: 9px;
        font-size: 12px;
    }

    .disclaimer {
        font-size: 9px;
    }
}
</style>
</head>
