<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">

<title>TETRON 4 U | AI Assistant</title>

<style>
:root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel2: #191d28;
    --border: #292e3b;
    --text: #f4f6fc;
    --muted: #929bad;
    --accent: #8b5cf6;
    --cyan: #06b6d4;
    --danger: #fb7185;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
}

button, textarea, select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.app {
    display: flex;
    height: 100dvh;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    background: #0e1017;
    border-right: 1px solid var(--border);
    z-index: 20;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 25px;
}

.brand img {
    width: 44px;
    height: 44px;
    object-fit: contain;
    border-radius: 12px;
}

.brand h2 {
    font-size: 16px;
    letter-spacing: 1px;
}

.brand small {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
}

.new-chat {
    width: 100%;
    padding: 12px;
    margin-bottom: 23px;
    text-align: left;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--panel2);
    color: white;
}

.section-title {
    margin: 0 0 12px 7px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.history {
    flex: 1;
    overflow-y: auto;
}

.history-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 9px;
    margin-bottom: 5px;
    border-radius: 9px;
    color: #cbd1df;
    font-size: 13px;
}

.history-item:hover,
.history-item.active {
    background: var(--panel2);
}

.history-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    cursor: pointer;
}

.delete-history {
    color: var(--muted);
    border: 0;
    background: transparent;
    font-size: 18px;
}

.sidebar-bottom {
    padding-top: 15px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
}

/* MAIN */

.main {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
}

.topbar {
    height: 68px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
}

.top-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.menu-btn {
    border: 0;
    background: transparent;
    color: white;
    font-size: 24px;
}

.provider-select,
.model-select {
    max-width: 180px;
    min-width: 0;
    padding: 9px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel2);
    color: white;
    outline: none;
}

.provider-select {
    max-width: 130px;
}

.model-select {
    width: 180px;
}

.status {
    color: #6ee7b7;
    font-size: 11px;
    text-align: right;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px 16px;
    scroll-behavior: smooth;
}

.welcome {
    max-width: 680px;
    margin: 8vh auto 0;
    text-align: center;
}

.welcome-logo {
    width: 75px;
    height: 75px;
    object-fit: contain;
    margin-bottom: 20px;
}

.welcome h1 {
    margin-bottom: 12px;
    font-size: clamp(27px, 5vw, 42px);
    letter-spacing: -1px;
}

.gradient-text {
    color: transparent;
    background: linear-gradient(90deg, #a78bfa, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
}

.welcome p {
    color: var(--muted);
    line-height: 1.7;
    font-size: 14px;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 30px;
}

.suggestion {
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--panel);
    color: #dce2ef;
    text-align: left;
    font-size: 13px;
}

.suggestion:hover {
    border-color: var(--accent);
}

.messages {
    max-width: 820px;
    margin: auto;
}

.message {
    display: flex;
    gap: 12px;
    margin: 0 auto 25px;
    font-size: 14px;
    line-height: 1.75;
    overflow-wrap: anywhere;
}

.avatar {
    width: 35px;
    height: 35px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--panel2);
}

.message-body {
    flex: 1;
    min-width: 0;
    padding-top: 3px;
}

.message-name {
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 12px;
}

.message-text {
    white-space: pre-wrap;
}

.message-image {
    display: block;
    max-width: min(100%, 280px);
    max-height: 280px;
    margin-bottom: 10px;
    border-radius: 12px;
    object-fit: contain;
}

.copy-btn {
    padding: 5px 9px;
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--panel2);
    color: #cbd5e1;
    font-size: 11px;
}

/* INPUT */

.composer-wrap {
    flex-shrink: 0;
    padding: 10px 16px 15px;
}

.composer {
    max-width: 820px;
    padding: 12px;
    margin: auto;
    border: 1px solid #353b4b;
    border-radius: 18px;
    background: var(--panel);
}

.preview-area:empty {
    display: none;
}

.preview-area {
    padding: 3px 5px 12px;
}

.preview-area img {
    width: 75px;
    height: 75px;
    border-radius: 10px;
    object-fit: cover;
}

.preview-remove {
    display: block;
    border: 0;
    background: transparent;
    color: var(--danger);
    font-size: 12px;
}

textarea {
    display: block;
    width: 100%;
    min-height: 45px;
    max-height: 140px;
    padding: 10px 7px;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: white;
    font-size: 14px;
}

textarea::placeholder {
    color: #7e8799;
}

.composer-tools {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 8px;
}

.tool-left,
.tool-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.tool-btn {
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel2);
    color: #cbd5e1;
    font-size: 12px;
}

.tool-btn.active {
    background: #44202b;
    color: var(--danger);
}

.send-btn {
    padding: 10px 15px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #6d5dfc);
    color: white;
    font-weight: 600;
}

.disclaimer {
    max-width: 820px;
    margin: 9px auto 0;
    color: #717b8d;
    font-size: 10px;
    line-height: 1.5;
    text-align: center;
}

.backdrop {
    display: none;
}

/* MOBILE */

@media (max-width: 700px) {
    .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 280px;
        transform: translateX(-105%);
        transition: transform .25s ease;
        box-shadow: none;
    }

    .sidebar.open {
        transform: translateX(0);
        box-shadow: 15px 0 50px #0008;
    }

    .backdrop.show {
        position: fixed;
        inset: 0;
        display: block;
        background: #0009;
        z-index: 19;
    }

    .topbar {
        height: 62px;
        padding: 0 10px;
    }

    .top-left {
        gap: 7px;
    }

    .provider-select {
        max-width: 105px;
        padding: 8px 5px;
        font-size: 11px;
    }

    .model-select {
        width: 135px;
        max-width: 135px;
        padding: 8px 5px;
        font-size: 11px;
    }

    .status {
        display: none;
    }

    .chat {
        padding: 18px 12px;
    }

    .welcome {
        margin-top: 6vh;
    }

    .welcome-logo {
        width: 65px;
        height: 65px;
    }

    .suggestions {
        grid-template-columns: 1fr;
        gap: 9px;
        margin-top: 23px;
    }

    .suggestion {
        padding: 12px;
    }

    .composer-wrap {
        padding: 8px 9px 11px;
    }

    .tool-btn {
        padding: 9px;
    }

    .disclaimer {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <img src="/tetron-logo.png"
                 alt="TETRON 4 U Logo"
                 onerror="this.style.display='none'">

            <div>
                <h2>TETRON 4 U</h2>
                <small>YOUR AI WORKSPACE</small>
            </div>
        </div>

        <button class="new-chat" id="newChatBtn">
            ＋ &nbsp; New Chat
        </button>

        <div class="section-title">Chat history</div>
        <div class="history" id="history"></div>

        <div class="sidebar-bottom">
            ✦ Gemini + OpenAI
        </div>

    </aside>

    <div class="backdrop" id="backdrop"></div>

    <main class="main">

        <header class="topbar">

            <div class="top-left">

                <button class="menu-btn" id="menuBtn"
                        aria-label="Toggle sidebar">☰</button>

                <select class="provider-select" id="providerSelect"
                        aria-label="Select AI provider">
                    <option value="gemini">✦ Gemini</option>
                    <option value="openai">◉ ChatGPT</option>
                </select>

                <select class="model-select" id="modelSelect"
                        aria-label="Select AI model">
                    <option value="">Loading models...</option>
                </select>

            </div>

            <div class="status" id="status">Connecting...</div>

        </header>

        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <img class="welcome-logo"
                     src="/tetron-logo.png"
                     alt="TETRON 4 U"
                     onerror="this.style.display='none'">

                <h1>Welcome to <span class="gradient-text">
                    TETRON 4 U</span></h1>

                <p>
                    One workspace. Multiple AI models.<br>
                    Ask questions, write code, explore ideas and create.
                </p>

                <div class="suggestions">

                    <button class="suggestion"
                        data-prompt="Explain artificial intelligence in simple words.">
                        💡 Explain a complex topic
                    </button>

                    <button class="suggestion"
                        data-prompt="Help me write a professional email.">
                        ✍️ Write something professional
                    </button>

                    <button class="suggestion"
                        data-prompt="Help me debug my programming code.">
                        💻 Debug my code
                    </button>

                    <button class="suggestion"
                        data-prompt="Give me unique AI project ideas for college.">
                        🚀 Discover project ideas
                    </button>

                </div>

            </div>

            <div class="messages" id="messages"></div>

        </section>

        <footer class="composer-wrap">

            <div class="composer">

                <div class="preview-area" id="previewArea"></div>

                <textarea id="prompt"
                    rows="1"
                    placeholder="Message TETRON 4 U..."
                    aria-label="Write your message"></textarea>

                <div class="composer-tools">

                    <div class="tool-left">

                        <button class="tool-btn" id="uploadBtn">
                            ＋ Image
                        </button>

                        <input type="file"
                            id="imageInput"
                            accept="image/*"
                            hidden>

                        <button class="tool-btn" id="micBtn"
                            aria-label="Voice input">
                            🎙️
                        </button>

                    </div>

                    <div class="tool-right">
                        <button class="send-btn" id="sendBtn">
                            Send ↑
                        </button>
                    </div>

                </div>

            </div>

            <div class="disclaimer">
                AI responses may contain errors. Check important information.
            </div>

        </footer>

    </main>

</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const sidebar = $("sidebar");
const backdrop = $("backdrop");
const chatEl = $("chat");
const messagesEl = $("messages");
const welcome = $("welcome");
const promptEl = $("prompt");
const providerSelect = $("providerSelect");
const modelSelect = $("modelSelect");
const imageInput = $("imageInput");
const previewArea = $("previewArea");
const sendBtn = $("sendBtn");
const micBtn = $("micBtn");
const statusEl = $("status");

let selectedImage = null;
let currentChatId = null;
let modelCache = {};
let isSending = false;
let conversations = [];

try {
    conversations = JSON.parse(
        localStorage.getItem("tetron_history") || "[]"
    );

    if (!Array.isArray(conversations)) {
        conversations = [];
    }
} catch {
    conversations = [];
}

/* HISTORY */

function saveHistory() {
    try {
        const safeHistory = conversations.map(chat => ({
            id: chat.id,
            title: chat.title,
            provider: chat.provider,
            model: chat.model,
            messages: chat.messages.map(message => ({
                role: message.role,
                text: message.text
            }))
        }));

        localStorage.setItem(
            "tetron_history",
            JSON.stringify(safeHistory)
        );
    } catch (error) {
        console.warn("Could not save chat history.", error);
        statusEl.textContent = "History storage full";
    }
}

function newChat() {
    currentChatId = String(
        Date.now() + Math.random().toString(16).slice(2)
    );

    conversations.unshift({
        id: currentChatId,
        title: "New conversation",
        provider: providerSelect.value,
        model: modelSelect.value,
        messages: []
    });

    messagesEl.innerHTML = "";
    welcome.style.display = "block";
    promptEl.value = "";
    promptEl.style.height = "45px";
    clearImage();

    renderHistory();
    closeSidebar();
}

function getCurrentChat() {
    let current = conversations.find(
        item => item.id === currentChatId
    );

    if (!current) {
        newChat();

        current = conversations.find(
            item => item.id === currentChatId
        );
    }

    return current;
}

function renderHistory() {
    const historyEl = $("history");
    historyEl.innerHTML = "";

    conversations.forEach(conversation => {
        const row = document.createElement("div");
        row.className = "history-item";

        if (conversation.id === currentChatId) {
            row.classList.add("active");
        }

        const icon = document.createElement("span");
        icon.textContent = "▤";

        const title = document.createElement("span");
        title.className = "history-title";
        title.textContent = conversation.title || "New conversation";

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-history";
        deleteBtn.textContent = "×";
        deleteBtn.setAttribute("aria-label", "Delete conversation");

        const open = () => openChat(conversation.id);

        icon.addEventListener("click", open);
        title.addEventListener("click", open);

        deleteBtn.addEventListener("click", event => {
            event.stopPropagation();

            conversations = conversations.filter(
                item => item.id !== conversation.id
            );

            if (currentChatId === conversation.id) {
                currentChatId = null;
                messagesEl.innerHTML = "";
                welcome.style.display = "block";
            }

            saveHistory();
            renderHistory();
        });

        row.append(icon, title, deleteBtn);
        historyEl.appendChild(row);
    });
}

function openChat(id) {
    const conversation = conversations.find(
        item => item.id === id
    );

    if (!conversation) return;

    currentChatId = id;

    providerSelect.value = conversation.provider || "gemini";
    loadModels().then(() => {
        if (conversation.model) {
            const exists = [...modelSelect.options].some(
                option => option.value === conversation.model
            );

            if (exists) {
                modelSelect.value = conversation.model;
            }
        }
    });

    messagesEl.innerHTML = "";

    welcome.style.display =
        conversation.messages.length ? "none" : "block";

    conversation.messages.forEach(message => {
        renderMessage(message.role, message.text);
    });

    renderHistory();
    closeSidebar();
}

$("newChatBtn").addEventListener("click", newChat);

$("menuBtn").addEventListener("click", () => {
    sidebar.classList.toggle("open");
    backdrop.classList.toggle("show");
});

function closeSidebar() {
    sidebar.classList.remove("open");
    backdrop.classList.remove("show");
}

backdrop.addEventListener("click", closeSidebar);

/* SAFE MESSAGE RENDERING */

function renderMessage(role, text, imageURL = null) {
    welcome.style.display = "none";

    const wrapper = document.createElement("div");
    wrapper.className = "message";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "👤" : "✦";

    const body = document.createElement("div");
    body.className = "message-body";

    const name = document.createElement("div");
    name.className = "message-name";
    name.textContent = role === "user" ? "You" : "TETRON 4 U";

    body.appendChild(name);

    if (imageURL) {
        const image = document.createElement("img");
        image.className = "message-image";
        image.src = imageURL;
        image.alt = "Uploaded image";
        body.appendChild(image);
    }

    const textEl = document.createElement("div");
    textEl.className = "message-text";
    textEl.textContent = text;
    body.appendChild(textEl);

    if (role === "assistant") {
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.textContent = "Copy response";

        copyBtn.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(text);
                copyBtn.textContent = "Copied!";

                setTimeout(() => {
                    copyBtn.textContent = "Copy response";
                }, 1200);
            } catch {
                statusEl.textContent = "Unable to copy";
            }
        });

        body.appendChild(copyBtn);
    }

    wrapper.append(avatar, body);
    messagesEl.appendChild(wrapper);
    chatEl.scrollTop = chatEl.scrollHeight;

    return wrapper;
}

/* PROVIDER MODEL LOADING */

async function loadModels() {
    const provider = providerSelect.value;

    modelSelect.innerHTML = "";

    const loadingOption = document.createElement("option");
    loadingOption.value = "";
    loadingOption.textContent = "Loading models...";
    modelSelect.appendChild(loadingOption);

    modelSelect.disabled = true;
    statusEl.textContent = "Loading models...";

    try {
        let models = modelCache[provider];

        if (!models) {
            const response = await fetch(
                "/api/models?provider=" + encodeURIComponent(provider)
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Unable to load models."
                );
            }

            models = data.models || [];
            modelCache[provider] = models;
        }

        modelSelect.innerHTML = "";

        if (models.length === 0) {
            const option = document.createElement("option");
            option.value = "";
            option.textContent = "No models available";
            modelSelect.appendChild(option);
            throw new Error("No models returned by this API key.");
        }

        models.forEach(model => {
            const option = document.createElement("option");
            option.value = model.id;
            option.textContent = model.name || model.id;
            option.title = model.description || "";
            modelSelect.appendChild(option);
        });

        modelSelect.disabled = false;
        statusEl.textContent = "● Ready";

        const current = conversations.find(
            item => item.id === currentChatId
        );

        if (current && current.provider === provider && current.model) {
            const exists = models.some(
                item => item.id === current.model
            );

            if (exists) {
                modelSelect.value = current.model;
            }
        }

    } catch (error) {
        modelSelect.innerHTML = "";

        const option = document.createElement("option");
        option.value = "";
        option.textContent = "Models unavailable";
        modelSelect.appendChild(option);

        modelSelect.disabled = true;
        statusEl.textContent = "API unavailable";

        console.error("Model loading error:", error.message);
    }
}

providerSelect.addEventListener("change", async () => {
    await loadModels();

    const current = conversations.find(
        item => item.id === currentChatId
    );

    if (current) {
        current.provider = providerSelect.value;
        current.model = modelSelect.value;
        saveHistory();
    }
});

modelSelect.addEventListener("change", () => {
    const current = conversations.find(
        item => item.id === currentChatId
    );

    if (current) {
        current.model = modelSelect.value;
        saveHistory();
    }
});

/* IMAGE UPLOAD */

$("uploadBtn").addEventListener("click", () => {
    imageInput.click();
});

function clearImage() {
    selectedImage = null;
    imageInput.value = "";
    previewArea.innerHTML = "";
}

imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("Please select a valid image.");
        clearImage();
        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        alert("Image must be 5 MB or smaller.");
        clearImage();
        return;
    }

    selectedImage = file;

    const reader = new FileReader();

    reader.onload = event => {
        previewArea.innerHTML = "";

        const image = document.createElement("img");
        image.src = event.target.result;
        image.alt = "Selected image preview";

        const removeBtn = document.createElement("button");
        removeBtn.className = "preview-remove";
        removeBtn.textContent = "Remove image ×";
        removeBtn.addEventListener("click", clearImage);

        previewArea.append(image, removeBtn);
    };

    reader.readAsDataURL(file);
});

/* VOICE INPUT */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let listening = false;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-IN";

    recognition.onstart = () => {
        listening = true;
        micBtn.classList.add("active");
        micBtn.textContent = "🔴";
        statusEl.textContent = "Listening...";
    };

    recognition.onresult = event => {
        const spokenText = event.results[0][0].transcript;

        promptEl.value =
            (promptEl.value + " " + spokenText).trim();

        promptEl.dispatchEvent(new Event("input"));
    };

    recognition.onerror = event => {
        statusEl.textContent = "Voice input error";
        console.error("Voice error:", event.error);
    };

    recognition.onend = () => {
        listening = false;
        micBtn.classList.remove("active");
        micBtn.textContent = "🎙️";
        statusEl.textContent = "● Ready";
    };
}

micBtn.addEventListener("click", () => {
    if (!recognition) {
        alert(
            "Voice recognition is not supported by this browser. Try a supported browser and allow microphone access."
        );
        return;
    }

    if (listening) {
        recognition.stop();
        return;
    }

    recognition.lang = "en-IN";

    try {
        recognition.start();
    } catch (error) {
        console.error(error);
    }
});

/* SEND MESSAGE */

async function sendMessage() {
    if (isSending) return;

    const text = promptEl.value.trim();
    const imageFile = selectedImage;

    if (!text && !imageFile) return;

    const provider = providerSelect.value;
    const model = modelSelect.value;

    if (!model) {
        alert("Please select an available AI model first.");
        return;
    }

    const conversation = getCurrentChat();

    conversation.provider = provider;
    conversation.model = model;

    const userText = text ||
        "Please analyze the uploaded image.";

    if (conversation.messages.length === 0) {
        conversation.title = userText.slice(0, 38);
    }

    conversation.messages.push({
        role: "user",
        text: userText
    });

    let imageURL = null;

    if (imageFile) {
        imageURL = URL.createObjectURL(imageFile);
    }

    renderMessage("user", userText, imageURL);

    promptEl.value = "";
    promptEl.style.height = "45px";
    clearImage();

    saveHistory();
    renderHistory();

    isSending = true;
    sendBtn.disabled = true;
    sendBtn.textContent = "Thinking...";
    statusEl.textContent = "AI is thinking...";

    const loadingMessage = renderMessage(
        "assistant",
        "Thinking..."
    );

    try {
        let response;

        if (imageFile) {
            /*
              This sends multipart/form-data.
              Your current server.js does not yet support image uploads.
              Add backend image handling before expecting image analysis.
            */

            const formData = new FormData();

            formData.append("message", userText);
            formData.append("provider", provider);
            formData.append("model", model);
            formData.append("image", imageFile);

            response = await fetch("/api/chat", {
                method: "POST",
                body: formData
            });

        } else {
            response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: userText,
                    provider: provider,
                    model: model
                })
            });
        }

        const data = await response.json();

        if (!response.ok || data.success === false) {
            throw new Error(
                data.error || "The AI request failed."
            );
        }

        const answer =
            data.answer ||
            data.reply ||
            data.response ||
            data.text;

        if (typeof answer !== "string" || !answer.trim()) {
            throw new Error(
                "The backend did not return an answer. Check server.js."
            );
        }

        loadingMessage.remove();

        conversation.messages.push({
            role: "assistant",
            text: answer
        });

        renderMessage("assistant", answer);

        statusEl.textContent = "● Ready";

    } catch (error) {
        loadingMessage.remove();

        const errorText =
            "Request failed: " + error.message;

        conversation.messages.push({
            role: "assistant",
            text: errorText
        });

        renderMessage("assistant", errorText);

        statusEl.textContent = "Request failed";

    } finally {
        if (imageURL) {
            URL.revokeObjectURL(imageURL);
        }

        isSending = false;
        sendBtn.disabled = false;
        sendBtn.textContent = "Send ↑";

        saveHistory();
        renderHistory();
    }
}

sendBtn.addEventListener("click", sendMessage);

promptEl.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

promptEl.addEventListener("input", () => {
    promptEl.style.height = "45px";

    promptEl.style.height =
        Math.min(promptEl.scrollHeight, 140) + "px";
});

/* SUGGESTIONS */

document.querySelectorAll(".suggestion").forEach(button => {
    button.addEventListener("click", () => {
        promptEl.value = button.dataset.prompt;
        promptEl.focus();

        promptEl.dispatchEvent(new Event("input"));
    });
});

/* INITIALIZE */

async function initialize() {
    renderHistory();

    const firstConversation = conversations[0];

    if (firstConversation) {
        currentChatId = firstConversation.id;
        providerSelect.value =
            firstConversation.provider || "gemini";

        await loadModels();

        openChat(firstConversation.id);

    } else {
        await loadModels();
        newChat();
    }
}

initialize();
</script>
